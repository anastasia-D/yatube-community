<nav class="navbar navbar-expand bg-body-tertiary">
  <div class="container flex-wrap gap-2">
    <a class="navbar-brand" href="{% url 'posts:index' %}">Yatube Community</a>
    <div class="d-flex flex-wrap align-items-center gap-3">
      <a href="{% url 'about:author' %}">Об авторе</a>
      <a href="{% url 'about:tech' %}">Технологии</a>
      {% if user.is_authenticated %}
        <a href="{% url 'posts:post_create' %}">Новая запись</a>
        <a href="{% url 'posts:profile' user.username %}">{{ user.username }}</a>
        <form method="post" action="{% url 'users:logout' %}">
          {% csrf_token %}
          <button type="submit" class="btn btn-outline-secondary btn-sm">Выйти</button>
        </form>
      {% else %}
        <a href="{% url 'users:login' %}">Войти</a>
        <a href="{% url 'users:signup' %}">Регистрация</a>
      {% endif %}
    </div>
  </div>
</nav>
