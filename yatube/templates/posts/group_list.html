{% extends "base.html" %}
{% block title %}
  {{ group.title }}
{% endblock title %}
{% block content %}
  <div class="container py-5">
    <h1>{{ group.description }}</h1>

    {% for post in posts %}
      <h3>{{ group.title }}</h3>
      {% include "posts/includes/post.html" %}
      {% if not forloop.last %}<hr>{% endif %}
    {% endfor %}

  </div>
{% endblock content %}
