{% extends 'base.html' %}
{% block title %}{% if post %}Редактировать запись{% else %}Новая запись{% endif %}{% endblock %}
{% block content %}
  <h1>{% if post %}Редактировать запись{% else %}Новая запись{% endif %}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">
      {% if post %}Сохранить{% else %}Опубликовать{% endif %}
    </button>
  </form>
{% endblock %}
